<!doctype html>
<html lang="en" data-theme="rose">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Glow Leen</title>
  <meta name="description" content="Personal calorie & meal tracker">
  <meta name="theme-color" content="#0a0912">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Glow Leen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-blobs"><span></span><span></span><span></span></div>

  <div id="splash" class="splash"></div>

  <main id="app"></main>

  <nav class="nav" id="nav">
    <button data-tab="home" class="on"><span class="ic">🏠</span>Today</button>
    <button data-tab="meals"><span class="ic">🍽️</span>Meals</button>
    <button class="fab" data-action="quick-add" aria-label="Add food">+</button>
    <button data-tab="calendar"><span class="ic">📅</span>Calendar</button>
    <button data-tab="progress"><span class="ic">📈</span>Progress</button>
  </nav>

  <div id="sheetBack" class="sheet-back" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast"></div>
  <canvas id="confetti"></canvas>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="var(--a1)" />
        <stop offset="100%" stop-color="var(--a2)" />
      </linearGradient>
    </defs>
  </svg>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
